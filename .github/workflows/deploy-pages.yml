# Static deployment of the landing page to GitHub Pages.
#
# This builds the client-only WASM bundle (`dx build @client --web`) and ships
# it to Pages. The build-upload API (src/server/builds) is a fullstack server
# feature and is NOT part of this deployment — it needs a real server host.
#
# One-time repo setup: Settings → Pages → Source must be "GitHub Actions"
# (the configure-pages step below attempts to enable this automatically).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The plugin registry (companion-lab/plugin-registry) pings this after a
  # registration PR merges, so a new plugin reaches the /plugins page in
  # minutes instead of waiting for the daily rebuild below.
  repository_dispatch:
    types: [plugin-registry-updated]
  schedule:
    # Daily refresh: plugin releases happen in other repos and can't trigger
    # this workflow, and a missed registry dispatch self-heals here — the
    # catalog is re-synced from the registry on a clock instead.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  # contents: write lets the build job push the synced catalog back to main.
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refresh the embedded plugin catalog from the community registry
      # (companion-lab/plugin-registry's plugins.json — see
      # scripts/sync-registry.mjs). Best-effort: a registry fetch failure
      # keeps the committed catalog, so this never breaks the deploy.
      # Committed back with [skip ci] so the push doesn't retrigger this
      # workflow (the run below already deploys).
      - name: Sync plugin catalog from the registry
        run: node scripts/sync-registry.mjs

      - name: Commit synced catalog
        run: |
          if git diff --quiet src/plugin_catalog.rs; then
            echo "catalog unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "[skip ci] chore: sync plugin catalog from the registry"
            git push
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Deployed from the root-domain repo (<owner>.github.io), so the site is
      # served at https://<owner>.github.io/ and asset URLs need no prefix.
      # If this workflow ever runs in a project repo, add
      # --base-path "/${GITHUB_REPOSITORY#*/}" to the build step below.

      # Prebuilt CLI from the Dioxus release (a cargo install takes ~6 min).
      # Keep this version in sync with `dioxus` in Cargo.toml.
      - name: Install dx CLI
        run: |
          curl -fsSL -o dx.tar.gz \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf dx.tar.gz
          install -m 755 dx /usr/local/bin/dx
          dx --version

      # build.rs resolves the site links from a `.env` at the workspace root
      # (gitignored, so it never reaches CI). Regenerate it here from
      # repository variables — public URLs, not secrets, so `vars.*` is fine.
      # Unset variables are skipped and build.rs falls back to its defaults.
      # The plugin release API/CDN bases are deliberately absent: since the
      # registry stores full owner/repo slugs, build.rs's suffix-less defaults
      # are authoritative, and a stale org-prefixed repo variable must not
      # override them.
      - name: Create .env from repository variables
        env:
          COMMUNITY_GITHUB_URL: ${{ vars.COMMUNITY_GITHUB_URL }}
          DISCORD_URL: ${{ vars.DISCORD_URL }}
          RELEASES_URL: ${{ vars.RELEASES_URL }}
        run: |
          : > .env
          for key in COMMUNITY_GITHUB_URL DISCORD_URL RELEASES_URL; do
            value="${!key}"
            # `if` rather than `[ … ] && …` — under `bash -e`, an empty
            # variable would make the failed test the loop's exit status
            # and abort the step.
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          done

      - name: Build static web app
        run: dx build @client --web --release

      - name: Prepare Pages artifact
        working-directory: target/dx/companion-landing-page/release/web/public
        run: |
          # SPA fallback: GitHub Pages serves 404.html for unknown paths, which
          # boots the app and lets the router render the catch-all route.
          cp index.html 404.html
          touch .nojekyll
          # dx drops a backup of the custom index.html template next to the
          # output; don't ship it.
          rm -f index.html.bak

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/companion-landing-page/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
