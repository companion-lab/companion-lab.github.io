<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{app_title}</title>
        <meta charset="UTF-8">
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta
            name="description"
            content="Companion puts a transparent VRM avatar on your desktop — the visual body of your AI agent. Open-source, plugin-based, and built with Tauri v2."
        >
        <meta name="theme-color" content="#05010f">

        <!-- Static icon links so browsers never hit the /favicon.ico fallback
             (which logs a console error and delays icon discovery). -->
        <link rel="icon" type="image/png" href="/{base_path}/favicon.png">
        <link rel="icon" type="image/x-icon" href="/{base_path}/favicon.ico">
        <link rel="apple-touch-icon" href="/{base_path}/icon.png">

        <!-- Stylesheets are static (unhashed, from public/) so the prerendered
             SSG pages paint fully styled before the wasm boots: the LCP is the
             prerendered hero text and the wasm hydrates it afterwards. -->
        <link rel="stylesheet" href="/{base_path}/main.css">
        <link rel="stylesheet" href="/{base_path}/tailwind.css">

        <!-- Fonts — only the weights the UI uses. The stylesheet loads
             non-blocking (media=print swap): it is third-party, so making the
             first paint wait on it would push FCP/LCP past the entire wasm
             boot on slow connections. display=swap keeps text painting in the
             fallback face while the files load. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
        </noscript>
        <!-- Icons are inline SVGs (components::atoms::Icon) — no FontAwesome
             webfont stylesheet (render-blocking, ~100 KB, 90% unused). -->

        <!-- Social preview cards -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Companion">
        <meta property="og:title" content="{app_title}">
        <meta
            property="og:description"
            content="The visual body of your AI agent: a transparent VRM avatar that lives on your desktop. Open-source, plugin-based, built with Tauri v2."
        >
        <meta property="og:url" content="https://companion-lab.github.io/{base_path}/">
        <meta property="og:image" content="https://companion-lab.github.io/{base_path}/icon.png">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="{app_title}">
        <meta
            name="twitter:description"
            content="The visual body of your AI agent: a transparent VRM avatar that lives on your desktop. Open-source, plugin-based, built with Tauri v2."
        >
        <meta name="twitter:image" content="https://companion-lab.github.io/{base_path}/icon.png">
    </head>
    <body>
        <!-- The wasm hydrates the prerendered markup, so the real content
             paints from HTML — no splash needed. -->
        <div id="main"></div>
        <script>
            // Stash the entry URL's hash before the WASM bundle runs: the
            // router rewrites the URL to the canonical route (dropping the
            // fragment) while booting, and first-load #section scrolls
            // (see scroll_to_entry_hash) need the original.
            window.__initialHash = window.location.hash;
        </script>
    </body>
</html>
